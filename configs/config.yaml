data:
  path: "data/employee_attrition.csv"
  target: "Attrition"
  test_size: 0.20
  random_state: 42

model:
  type: "RandomForestClassifier"
  n_estimators: 100
  max_depth: 10
  min_samples_split: 2
  min_samples_leaf: 1
  random_state: 42

training:
  experiment_name: "employee-attrition"
  model_output: "models/attrition_model.joblib"
  primary_metric: "accuracy"
  minimum_accuracy: 0.75
  

monitoring:
  drift_threshold: 0.20